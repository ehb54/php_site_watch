# Tier 3: site-lockdown on real VMs, rebooted (test/test-vm.sh): every Sunday, on demand, and on
# pull requests that change site-lockdown, its units or this test. Each job boots a cloud image
# with KVM on the runner, and checks from the runner that Apache stays blocked through a reboot.
name: VM

on:
  schedule:
    - cron: '41 7 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - site-lockdown.pl
      - setup.sh
      - 'systemd/**'
      - test/test-vm.sh
      - .github/workflows/vm.yml

permissions:
  contents: read

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  vm:
    name: test-vm ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name: [rocky8, rocky9, rocky10, ubuntu24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # the runners have KVM, but only root may open it until a udev rule says otherwise
      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get -qq update
          sudo apt-get -qq -y install --no-install-recommends qemu-system-x86 qemu-utils genisoimage > /dev/null
          ls -l /dev/kvm
      - run: bash test/test-vm.sh "$NAME"
        env:
          NAME: ${{ matrix.name }}
