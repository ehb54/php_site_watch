# php-site-watch settings for a GenApp web container: Apache with mod_php, PHP running as www-data.
# Copy it into the container as /etc/php-site-watch.conf and run php-site-watch there from the
# host's cron (see "Containers" in the README). It allows what GenApp normally does as www-data,
# so that only the unexpected is reported.

user = www-data

# The web pages, GenApp's applications, and the temporary directories
scan = /var/www
scan = /opt/genapp
scan = /tmp
scan = /var/tmp
scan = /dev/shm

# Files GenApp writes as www-data: job results, and each application's logs
exclude = /results/
exclude = ^/opt/genapp/[^/]+/output/html5/log/

# GenApp's job output and debug logs in /tmp, once you know your applications write them
# exclude = ^/tmp/(php_errors|mylog\w*)$

# GenApp starts each job through util/jobrun.php, which pipes the job's output through head
# (adjust the path if the web pages are not in /var/www/html)
allow-proc = ^/usr/local/bin/php /var/www/html/[^/ ]+/util/jobrun\.php
allow-proc = ^head -c\d+$

# The programs each application runs for its jobs, e.g. for an application called myapp whose
# modules are Python scripts in /opt/genapp/myapp/bin:
# allow-proc = ^(sh -c )?(/usr/bin/python3 )?/opt/genapp/myapp/bin/

# SSH to the compute resources that run jobs. To be stricter, list their addresses instead,
# e.g. ^192\.0\.2\.\d+:22$
# allow-peer = :22$
