# php-site-watch settings for an UltraScan LIMS (us3lims) server. Copy to /etc/php-site-watch.conf
# and adjust paths if your LIMS lives elsewhere. It allows what the LIMS normally does as us3, so
# that only the unexpected is reported.

user = us3

# The LIMS daemons, the cron jobs run through cronic, and the job status checks they run over SSH
# on the HPC clusters
allow-proc = ^/usr/bin/php /home/us3/lims/bin/(listen|submitctl|esign|manage-us3-pipe)\.php$
allow-proc = ^(/bin/bash /usr/bin/cronic )?php /home/us3/lims/bin/\w+\.php$
allow-proc = ^(sh -c )?ssh \S+@\S+ /home/\S+/us3lims_gridctl/

# A login session as us3 (systemd user manager, PulseAudio, D-Bus)
allow-proc = ^(/usr/lib/systemd/systemd --user|\(sd-pam\)|/usr/bin/pulseaudio |/usr/bin/dbus-daemon --session)

# SSH to the HPC clusters. To be stricter, list your clusters instead, e.g. ^128\.211\.133\.\d+:22$
allow-peer = :22$

# Files the LIMS writes as us3: its logs and job logs, the analysis jobs' work directories,
# cronic's temporary output, desktop session settings and shell history, the nightly database
# backup's statistics, and the CAPTCHA background each LIMS instance regenerates, including
# archived or backed-up instances one directory down (arcYYYYMMDD/, bak/)
exclude = ^/home/us3/lims/etc/
exclude = ^/home/us3/lims/work/
exclude = ^/home/us3/\.config/
exclude = ^/home/us3/\.bash_history$
exclude = ^/tmp/tmp\.\w+/cronic\.(out|trace)$
exclude = ^/home/us3/lims/database/utils/\.uslims_backup_stats$
exclude = ^/srv/www/htdocs/uslims3/([^/]+/)?[^/]+/cap_bg\.jpg$
